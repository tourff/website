<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banner Management | Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; transition: 0.3s; }
        .dark body { background-color: #0d0915; color: white; }
        .glass-card { background: white; border: 1px solid #e2e8f0; border-radius: 24px; transition: 0.3s; }
        .dark .glass-card { background: rgba(22, 16, 33, 0.7); border-color: rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="p-8 lg:p-12 text-left">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-10">
            <div>
                <a href="admin.html" class="text-purple-600 font-bold text-xs uppercase tracking-widest hover:underline"><i class="fas fa-arrow-left mr-2"></i> Dashboard</a>
                <h1 class="text-3xl font-black mt-2">Banner Slider</h1>
            </div>
            <button onclick="toggleModal()" class="bg-purple-600 text-white px-8 py-3 rounded-2xl font-bold text-xs uppercase tracking-widest shadow-lg shadow-purple-500/20">
                <i class="fas fa-plus mr-2"></i> Add Banner
            </button>
        </header>

        <section class="glass-card p-8">
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="border-b dark:border-slate-800">
                            <th class="py-4 px-2 text-[10px] font-black text-slate-400 uppercase">Banner Preview</th>
                            <th class="py-4 px-2 text-[10px] font-black text-slate-400 uppercase">Details</th>
                            <th class="py-4 px-2 text-[10px] font-black text-slate-400 uppercase text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="slider-list-body"></tbody>
                </table>
            </div>
        </section>
    </div>

    <div id="slider-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-[#161021] w-full max-w-md rounded-[2.5rem] p-10 shadow-2xl">
            <h3 class="text-2xl font-black mb-6">Banner Details</h3>
            <form id="slider-form" class="space-y-4">
                <input type="text" id="s-image" placeholder="Image URL" class="w-full bg-slate-100 dark:bg-slate-800 p-4 rounded-xl outline-none text-sm" required>
                <input type="text" id="s-link" placeholder="Redirect Link (Optional)" class="w-full bg-slate-100 dark:bg-slate-800 p-4 rounded-xl outline-none text-sm">
                <input type="number" id="s-duration" placeholder="Display Duration (Seconds)" class="w-full bg-slate-100 dark:bg-slate-800 p-4 rounded-xl outline-none text-sm" value="5" required>
                
                <div class="flex gap-4 pt-4">
                    <button type="button" onclick="toggleModal()" class="flex-1 font-bold text-xs text-slate-400 uppercase">Cancel</button>
                    <button type="submit" class="flex-1 bg-purple-600 text-white py-4 rounded-xl font-bold text-xs uppercase tracking-widest">Save Banner</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/admin-slider.js"></script>
    <script>if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');</script>
</body>
</html>
