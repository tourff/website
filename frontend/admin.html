<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Admin Dashboard | Turjo Site</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0b0f1a; font-family: 'Plus Jakarta Sans', sans-serif; color: white; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .tab-btn.active { border-bottom: 2px solid #ec4899; color: #ec4899; }
        .status-msg { display: none; padding: 10px; border-radius: 8px; margin-bottom: 15px; text-align: center; font-size: 14px; font-weight: bold; }
        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center py-10 px-4">

    <div id="login-section" class="glass p-8 rounded-[2rem] w-full max-w-md shadow-2xl">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-black text-white uppercase tracking-tighter">Admin Portal</h2>
            <p class="text-gray-500 text-xs mt-2 uppercase tracking-widest">Secure Access Only</p>
        </div>
        
        <div id="login-msg" class="status-msg"></div>

        <input id="password" type="password" placeholder="Enter Admin Password" class="w-full bg-gray-900/50 border border-gray-700 p-4 rounded-xl mb-4 outline-none focus:border-pink-500 transition">
        <button onclick="login()" class="w-full bg-pink-600 hover:bg-pink-700 p-4 rounded-xl font-black uppercase text-xs tracking-widest transition shadow-lg shadow-pink-500/20">Access Dashboard</button>
    </div>

    <div id="admin-section" style="display:none;" class="glass p-8 rounded-[2.5rem] w-full max-w-4xl">
        <div class="flex justify-between items-center border-b border-white/5 pb-6 mb-8">
            <h2 class="text-2xl font-black uppercase tracking-tighter">Dashboard</h2>
            <button onclick="location.reload()" class="text-xs font-bold text-gray-500 hover:text-rose-500 transition">LOGOUT</button>
        </div>

        <div class="flex gap-8 mb-10 border-b border-white/5">
            <button onclick="showTab('products-tab')" id="btn-products-tab" class="tab-btn active pb-4 font-bold text-sm tracking-tight uppercase">Manage Products</button>
            <button onclick="showTab('banners-tab')" id="btn-banners-tab" class="tab-btn pb-4 font-bold text-sm tracking-tight uppercase">Manage Banners</button>
        </div>

        <div id="action-msg" class="status-msg"></div>

        <div id="products-tab" class="tab-content">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
                <div>
                    <h3 class="text-pink-500 font-black text-xs uppercase tracking-widest mb-6">Product Details</h3>
                    <div class="flex flex-col gap-4">
                        <input id="name" placeholder="Product Name" class="bg-gray-900/50 border border-gray-800 p-3 rounded-xl outline-none focus:border-pink-500 text-sm">
                        
                        <div class="grid grid-cols-2 gap-4">
                            <input id="price" placeholder="Current Price (৳)" class="bg-gray-900/50 border border-gray-800 p-3 rounded-xl outline-none focus:border-pink-500 text-sm">
                            <input id="oldPrice" placeholder="Old Price (Discount)" class="bg-gray-900/50 border border-gray-800 p-3 rounded-xl outline-none focus:border-pink-500 text-sm">
                        </div>

                        <input id="imgUrl" placeholder="Image URL" class="bg-gray-900/50 border border-gray-800 p-3 rounded-xl outline-none focus:border-pink-500 text-sm">
                        
                        <button id="publish-btn" onclick="addProduct()" class="bg-pink-600 p-3 rounded-xl font-bold text-xs uppercase tracking-widest mt-2 hover:bg-pink-700 transition">Publish Product</button>
                        <button onclick="resetProductForm()" class="text-[10px] text-gray-500 hover:text-white uppercase tracking-widest">Clear Form</button>
                    </div>
                </div>

                <div>
                    <h3 class="text-gray-500 font-black text-xs uppercase tracking-widest mb-6">Existing Products</h3>
                    <div id="admin-product-list" class="max-h-[400px] overflow-y-auto pr-2 space-y-3">
                        </div>
                </div>
            </div>
        </div>

        <div id="banners-tab" class="tab-content hidden">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
                <div>
                    <h3 class="text-blue-500 font-black text-xs uppercase tracking-widest mb-6">Upload Banner</h3>
                    <div class="flex flex-col gap-4">
                        <input id="bannerUrl" placeholder="Banner URL" class="bg-gray-900/50 border border-gray-800 p-3 rounded-xl outline-none focus:border-blue-500 text-sm">
                        <input id="displayTime" type="number" placeholder="Time (ms) - Default 5000" class="bg-gray-900/50 border border-gray-800 p-3 rounded-xl outline-none focus:border-blue-500 text-sm">
                        <button onclick="addBanner()" class="bg-blue-600 p-3 rounded-xl font-bold text-xs uppercase tracking-widest mt-2 hover:bg-blue-700 transition">Save Banner</button>
                    </div>
                </div>
                <div>
                    <h3 class="text-gray-500 font-black text-xs uppercase tracking-widest mb-6">Current Banners</h3>
                    <div id="admin-banner-list" class="max-h-[400px] overflow-y-auto pr-2 space-y-3">
                        </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
