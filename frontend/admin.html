<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Prime Products BD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; transition: background-color 0.3s, color 0.3s; overflow-x: hidden; }
        
        /* ১. সাইডবার স্মুথ ট্রানজিশন লজিক */
        #main-sidebar {
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
        }

        /* ২. মিনিমাইজ অবস্থায় স্টাইল */
        #main-sidebar.minimized {
            width: 85px;
            padding: 24px 12px;
        }

        #main-sidebar.minimized .sidebar-logo h1,
        #main-sidebar.minimized .sidebar-logo p,
        #main-sidebar.minimized nav span,
        #main-sidebar.minimized .badge-new,
        #main-sidebar.minimized .menu-label {
            display: none;
        }

        #main-sidebar.minimized .sidebar-item {
            justify-content: center;
            padding: 12px 0;
        }

        #main-sidebar.minimized .sidebar-item i {
            margin: 0;
            font-size: 18px;
        }

        /* সাধারণ স্টাইল */
        body { background-color: #f8fafc; color: #1e293b; }
        .sidebar-item { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-radius: 12px; transition: 0.3s; color: #64748b; font-size: 13px; font-weight: 600; cursor: pointer; }
        .sidebar-item:hover, .sidebar-item.active { background: #f1f5f9; color: #2563eb; }
        .glass-card { background: white; border: 1px solid #e2e8f0; border-radius: 24px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); transition: 0.3s; }
        .badge-new { background: #22c55e; color: white; font-size: 8px; padding: 2px 6px; border-radius: 20px; font-weight: 800; margin-left: auto; }
        
        .dark body { background-color: #0d0915 !important; color: #f8fafc !important; }
        .dark aside { background-color: #161021 !important; border-color: rgba(255, 255, 255, 0.05) !important; }
        .dark header { background-color: #161021 !important; border-color: rgba(255, 255, 255, 0.05) !important; }
        .dark .sidebar-item { color: #94a3b8; }
        .dark .sidebar-item:hover, .dark .sidebar-item.active { background: #1e162e !important; color: #f43f5e !important; }
    </style>
</head>
<body class="flex min-h-screen transition-all">

    <aside id="main-sidebar" class="w-64 bg-white border-r border-slate-200 p-6 flex flex-col sticky top-0 h-screen overflow-y-auto z-[60]">
        
        <div class="flex items-center justify-between mb-10 px-2 sidebar-header">
            <div class="sidebar-logo text-left">
                <h1 class="font-extrabold text-lg tracking-tighter text-blue-600 dark:text-rose-500 uppercase">Admin Panel</h1>
                <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Premium Collection</p>
            </div>
            <button id="sidebar-toggle" class="w-8 h-8 flex items-center justify-center bg-slate-50 dark:bg-slate-800 rounded-lg hover:bg-blue-100 dark:hover:bg-rose-900/20 transition">
                <i id="toggle-icon" class="fas fa-chevron-left text-slate-400 text-xs"></i>
            </button>
        </div>

        <div class="space-y-6 text-left">
            <div>
                <p class="menu-label text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3 px-4">Main</p>
                <nav class="space-y-1">
                    <div class="sidebar-item active"><i class="fas fa-th-large"></i> <span>Dashboard</span></div>
                    <div class="sidebar-item"><i class="fas fa-chart-pie"></i> <span>Analytics</span></div>
                    <div class="sidebar-item"><i class="fas fa-file-alt"></i> <span>Reports</span></div>
                    <div class="sidebar-item"><i class="fas fa-box"></i> <span>Products</span></div>
                </nav>
            </div>
            
            <div>
                <p class="menu-label text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3 px-4">Hubs</p>
                <nav class="space-y-1">
                    <div class="sidebar-item"><i class="fas fa-layer-group text-blue-500"></i> <span>Operations Hub</span> <span class="badge-new">NEW</span></div>
                    <div class="sidebar-item"><i class="fas fa-briefcase text-orange-500"></i> <span>Business Hub</span> <span class="badge-new">NEW</span></div>
                    <div class="sidebar-item"><i class="fas fa-bullhorn text-purple-500"></i> <span>Marketing Hub</span> <span class="badge-new">NEW</span></div>
                </nav>
            </div>

            <div>
                <p class="menu-label text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3 px-4">System</p>
                <nav class="space-y-1">
                    <div class="sidebar-item"><i class="fas fa-shield-virus text-teal-500"></i> <span>Fraud Control</span> <span class="badge-new">NEW</span></div>
                    <div id="side-intelligence" class="sidebar-item"><i class="fas fa-user-cog text-slate-500"></i> <span>User Intelligence</span> <span class="badge-new">NEW</span></div>
                    <button onclick="handleAdminLogout()" class="sidebar-item text-rose-500 w-full"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></button>
                </nav>
            </div>
        </div>
    </aside>

    <main class="flex-1 overflow-x-hidden transition-all">
        <header class="bg-white border-b border-slate-200 p-6 sticky top-0 z-50 transition-all dark:bg-[#161021]">
            <div class="flex justify-between items-center">
                <h2 class="text-3xl font-extrabold tracking-tight">Welcome, Admin! 👋</h2>
                <button id="theme-toggle" class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-[#1e162e] flex items-center justify-center">
                    <i id="theme-icon" class="fas fa-moon text-slate-600 dark:text-yellow-400"></i>
                </button>
            </div>
        </header>
        <div class="p-8">
            <h1 class="text-xl font-bold">ড্যাশবোর্ড ডাটা এখানে দেখা যাবে।</h1>
        </div>
    </main>

    <script>
        // ৪. সাইডবার টগল স্ক্রিপ্ট
        const sidebar = document.getElementById('main-sidebar');
        const toggleBtn = document.getElementById('sidebar-toggle');
        const toggleIcon = document.getElementById('toggle-icon');

        toggleBtn.onclick = () => {
            sidebar.classList.toggle('minimized');
            const isMinimized = sidebar.classList.contains('minimized');
            
            // আইকন পরিবর্তন (Left Arrow <-> Right Arrow)
            if (isMinimized) {
                toggleIcon.classList.replace('fa-chevron-left', 'fa-chevron-right');
            } else {
                toggleIcon.classList.replace('fa-chevron-right', 'fa-chevron-left');
            }
            // অবস্থা সেভ করে রাখা
            localStorage.setItem('sidebar-minimized', isMinimized);
        };

        // পেজ লোড হওয়ার সময় আগের অবস্থা চেক করা
        if (localStorage.getItem('sidebar-minimized') === 'true') {
            sidebar.classList.add('minimized');
            toggleIcon.classList.replace('fa-chevron-left', 'fa-chevron-right');
        }
    </script>
    <script src="js/admin.js"></script>
</body>
</html>
