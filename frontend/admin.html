<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard | Turjo Site</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0d0915; color: white; font-family: sans-serif; }
        .input-box { background: #161021; border: 1px solid #251d33; width: 100%; padding: 12px; border-radius: 8px; margin-bottom: 15px; outline: none; color: white; }
    </style>
</head>
<body class="p-10">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-8 uppercase tracking-tighter">Publish Product</h1>
        <form id="product-form" class="bg-[#161021] p-8 rounded-2xl border border-white/5 mb-16 shadow-2xl">
            <input type="text" id="name" placeholder="Product Name" class="input-box" required>
            <input type="number" id="price" placeholder="Price (৳)" class="input-box" required>
            <input type="text" id="image" placeholder="Image URL" class="input-box" required>
            <textarea id="description" placeholder="Description" class="input-box h-32"></textarea>
            <button type="submit" class="w-full bg-rose-600 py-3 rounded-lg font-bold uppercase text-sm">Publish Product</button>
        </form>
        <h2 class="text-2xl font-bold mb-6">Manage Products</h2>
        <div id="admin-product-list" class="space-y-4"></div>
    </div>

    <script>
        const API_URL = 'https://website-production-f869.up.railway.app';

        document.getElementById('product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                name: document.getElementById('name').value,
                price: Number(document.getElementById('price').value),
                image: document.getElementById('image').value,
                description: document.getElementById('description').value
            };
            const res = await fetch(`${API_URL}/admin/add-product`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            if(res.ok) { alert("Success!"); location.reload(); }
        });

        async function loadAdminProducts() {
            try {
                const res = await fetch(`${API_URL}/products`);
                const products = await res.json();
                const list = document.getElementById('admin-product-list');
                if (Array.isArray(products)) {
                    list.innerHTML = '';
                    products.forEach(p => {
                        list.innerHTML += `
                            <div class="bg-[#161021] p-4 rounded-xl flex items-center justify-between border border-white/5">
                                <span class="font-bold text-sm uppercase">${p.name}</span>
                                <div class="flex gap-2">
                                    <button onclick="toggleStock('${p._id}')" class="px-3 py-1 text-xs rounded uppercase font-bold ${p.inStock ? 'bg-green-600' : 'bg-gray-600'}">Stock</button>
                                    <button onclick="deleteProduct('${p._id}')" class="px-3 py-1 text-xs bg-red-600 rounded uppercase font-bold">Delete</button>
                                </div>
                            </div>`;
                    });
                }
            } catch(err) { console.error("Error loading products"); }
        }

        async function toggleStock(id) { await fetch(`${API_URL}/admin/toggle-stock/${id}`, { method: 'PATCH' }); location.reload(); }
        async function deleteProduct(id) { if(confirm("Delete?")) { await fetch(`${API_URL}/admin/delete-product/${id}`, { method: 'DELETE' }); location.reload(); } }
        
        loadAdminProducts();
    </script>
</body>
</html>
