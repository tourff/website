<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Products Hub BD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0712; color: white; overflow-x: hidden; }
        
        .glass-sidebar { background: #161021; border-right: 1px solid rgba(255, 255, 255, 0.05); }
        .glass-card { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); transition: 0.3s; }
        .glass-card:hover { border-color: #f43f5e; transform: translateY(-5px); }
        
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #f43f5e; border-radius: 10px; }
        
        .active-link { background: rgba(255, 255, 255, 0.05); color: #f43f5e; border: 1px solid rgba(244, 63, 94, 0.2); }
    </style>
</head>
<body class="flex min-h-screen">

    <aside class="glass-sidebar w-64 hidden lg:flex flex-col p-6 sticky top-0 h-screen z-50">
        <div class="flex items-center gap-3 mb-12">
            <div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center shadow-lg shadow-white/5">
                <i class="fas fa-bolt text-black text-xl"></i>
            </div>
            <div>
                <h1 class="font-black uppercase tracking-tighter leading-none">Admin</h1>
                <p class="text-[8px] text-gray-500 uppercase tracking-widest font-bold">Control Panel</p>
            </div>
        </div>
        
        <nav class="flex flex-col gap-3 text-[10px] font-black uppercase tracking-[0.15em] text-gray-400">
            <a href="#" class="active-link flex items-center gap-4 p-4 rounded-2xl transition"><i class="fas fa-th-large text-sm"></i> Dashboard</a>
            <a href="#" class="hover:text-rose-500 flex items-center gap-4 p-4 transition"><i class="fas fa-shopping-bag text-sm"></i> Orders</a>
            <a href="#" class="hover:text-rose-500 flex items-center gap-4 p-4 transition"><i class="fas fa-box text-sm"></i> Products</a>
            <a href="#" class="hover:text-rose-500 flex items-center gap-4 p-4 transition"><i class="fas fa-users text-sm"></i> Customers</a>
            <a href="#" class="hover:text-rose-500 flex items-center gap-4 p-4 transition"><i class="fas fa-chart-line text-sm"></i> Analytics</a>
            <a href="#" class="hover:text-rose-500 flex items-center gap-4 p-4 transition"><i class="fas fa-cog text-sm"></i> Settings</a>
        </nav>

        <div class="mt-auto pt-6 border-t border-white/5">
            <button onclick="logout()" class="w-full text-left p-4 text-rose-500 flex items-center gap-4 text-[10px] font-black uppercase tracking-widest">
                <i class="fas fa-sign-out-alt text-sm"></i> Logout
            </button>
        </div>
    </aside>

    <main class="flex-1 p-6 md:p-12">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-12 gap-6">
            <div>
                <h2 class="text-4xl font-black tracking-tighter">Good Morning, Admin!</h2>
                <p class="text-[10px] text-gray-500 uppercase tracking-[0.2em] font-bold mt-2 flex items-center gap-2">
                    <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span> Store is live and active
                </p>
            </div>
            <div class="flex items-center gap-4">
                <div class="bg-white/5 p-4 rounded-2xl border border-white/5 flex items-center gap-4">
                    <div class="text-right hidden md:block">
                        <p class="text-[10px] font-black text-white uppercase leading-none">Turjo Sarker</p>
                        <p class="text-[8px] text-gray-500 uppercase font-bold mt-1">Super Admin</p>
                    </div>
                    <div class="w-10 h-10 bg-rose-500 rounded-xl flex items-center justify-center font-black">T</div>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-12">
            <div class="glass-card p-8 rounded-[2.5rem] relative overflow-hidden">
                <p class="text-[9px] text-gray-500 uppercase font-black tracking-widest mb-3">Total Revenue</p>
                <h3 id="total-revenue" class="text-3xl font-black text-rose-500 tracking-tighter">৳0</h3>
                <i class="fas fa-wallet absolute -right-4 -bottom-4 text-white/5 text-7xl -rotate-12"></i>
            </div>
            <div class="glass-card p-8 rounded-[2.5rem]">
                <p class="text-[9px] text-gray-500 uppercase font-black tracking-widest mb-3">Total Orders</p>
                <h3 id="order-count" class="text-3xl font-black text-white tracking-tighter">0</h3>
            </div>
            <div class="glass-card p-8 rounded-[2.5rem]">
                <p class="text-[9px] text-gray-500 uppercase font-black tracking-widest mb-3">Active Products</p>
                <h3 id="product-count" class="text-3xl font-black text-white tracking-tighter">0</h3>
            </div>
            <div class="glass-card p-8 rounded-[2.5rem]">
                <p class="text-[9px] text-gray-500 uppercase font-black tracking-widest mb-3">Daily Sales</p>
                <h3 id="today-sales" class="text-3xl font-black text-green-500 tracking-tighter">৳0</h3>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-8 glass-card p-10 rounded-[3rem]">
                <div class="flex justify-between items-center mb-10">
                    <h4 class="text-[10px] font-black uppercase tracking-widest text-gray-500">Revenue Analysis</h4>
                    <span class="text-[10px] font-bold text-rose-500 bg-rose-500/10 px-3 py-1 rounded-full uppercase">Live Data</span>
                </div>
                <div class="h-80 w-full">
                    <canvas id="revenueChart"></canvas>
                </div>
            </div>
            
            <div class="lg:col-span-4 glass-card p-10 rounded-[3rem]">
                <h4 class="text-[10px] font-black uppercase tracking-widest text-gray-500 mb-8">Recent Activity</h4>
                <div id="orders-list" class="space-y-6">
                    </div>
            </div>
        </div>
    </main>

    <script src="js/admin.js"></script>
</body>
</html>
