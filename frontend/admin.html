<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Turjo Site</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { background-color: #030712; font-family: 'Plus Jakarta Sans', sans-serif; color: #f3f4f6; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .tab-active { border-bottom: 2px solid #f43f5e; color: #f43f5e; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div id="login-box" class="glass p-8 rounded-3xl w-full max-w-md shadow-2xl transition-all">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-rose-500 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-rose-500/20">
                <i class="fas fa-user-shield text-2xl text-white"></i>
            </div>
            <h2 class="text-2xl font-black tracking-tight">ADMIN ACCESS</h2>
            <p class="text-gray-500 text-sm mt-1">Enter your secure credentials</p>
        </div>
        <input id="password" type="password" placeholder="Password" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl mb-4 focus:border-rose-500 outline-none transition">
        <button onclick="login()" class="w-full bg-rose-600 hover:bg-rose-700 p-4 rounded-2xl font-bold text-white shadow-lg shadow-rose-900/20 transition">Login Now</button>
    </div>

    <div id="panel" style="display:none;" class="glass p-8 rounded-[2.5rem] w-full max-w-4xl shadow-2xl">
        <div class="flex items-center justify-between mb-8 border-b border-white/5 pb-6">
            <h2 class="text-xl font-extrabold tracking-tighter uppercase">Admin <span class="text-rose-500">Dashboard</span></h2>
            <button onclick="location.reload()" class="text-gray-500 hover:text-white transition text-sm">Logout <i class="fas fa-sign-out-alt ml-1"></i></button>
        </div>

        <div class="flex gap-8 mb-10 text-sm font-bold">
            <button id="tab-add" onclick="switchTab('add')" class="tab-active pb-2 transition-all">ADD PRODUCT</button>
            <button id="tab-delete" onclick="switchTab('delete')" class="pb-2 transition-all text-gray-500">DELETE PRODUCT</button>
        </div>

        <div id="section-add">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input id="name" placeholder="Product Name" class="bg-white/5 border border-white/5 p-4 rounded-2xl focus:border-rose-500 outline-none">
                <input id="price" type="number" placeholder="Current Price (৳)" class="bg-white/5 border border-white/5 p-4 rounded-2xl focus:border-rose-500 outline-none">
                <input id="oldPrice" type="number" placeholder="Old Price (৳) - Optional" class="bg-white/5 border border-white/5 p-4 rounded-2xl focus:border-rose-500 outline-none">
                <input id="customDiscount" placeholder="Discount Text (e.g. 20% OFF)" class="bg-white/5 border border-white/5 p-4 rounded-2xl focus:border-rose-500 outline-none">
                <textarea id="description" placeholder="Short Description" class="md:col-span-2 bg-white/5 border border-white/5 p-4 rounded-2xl focus:border-rose-500 outline-none h-28"></textarea>
                <input id="imgUrl" placeholder="Image URL (Direct Link)" class="md:col-span-2 bg-white/5 border border-white/5 p-4 rounded-2xl focus:border-rose-500 outline-none">
                <button onclick="add()" class="md:col-span-2 bg-rose-600 hover:bg-rose-700 p-5 rounded-2xl font-black text-white shadow-xl shadow-rose-900/10 transition mt-4">PUBLISH PRODUCT</button>
            </div>
        </div>

        <div id="section-delete" style="display:none;">
            <div id="manage-list" class="grid grid-cols-1 gap-3 max-h-[400px] overflow-y-auto pr-2 custom-scrollbar">
                <p class="text-center text-gray-500 py-10">Fetching product list...</p>
            </div>
        </div>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
