
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products Hub | Premium Digital Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0b0f1a; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .product-card:hover { border-color: #ec4899; box-shadow: 0 0 20px rgba(236, 72, 153, 0.2); }
    </style>
</head>
<body class="text-gray-200 font-sans">
    <nav class="glass sticky top-0 z-50 p-4 mb-8">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-tr from-pink-500 to-violet-500 p-2 rounded-lg">
                    <i class="fas fa-bolt text-white text-xl"></i>
                </div>
                <span class="text-xl font-black tracking-tighter text-white">PRODUCTS HUB</span>
            </div>
            <div class="flex items-center space-x-6">
                <a href="admin.html" class="text-sm hover:text-pink-500 transition">Admin Panel</a>
                <button class="bg-white text-black px-5 py-2 rounded-full font-bold text-sm hover:bg-pink-500 hover:text-white transition">
                    Cart (0)
                </button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4">
        <div class="flex justify-between items-center mb-10">
            <h2 class="text-3xl font-bold text-white">Explore <span class="text-pink-500">Products</span></h2>
            <div class="flex space-x-2">
                <button class="glass px-4 py-2 rounded-lg text-xs">All</button>
                <button class="glass px-4 py-2 rounded-lg text-xs opacity-50">Software</button>
                <button class="glass px-4 py-2 rounded-lg text-xs opacity-50">Gaming</button>
            </div>
        </div>
        
        <div id="products" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-6 mb-20">
            <div class="animate-pulse glass h-64 rounded-2xl"></div>
            <div class="animate-pulse glass h-64 rounded-2xl"></div>
            <div class="animate-pulse glass h-64 rounded-2xl"></div>
        </div>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
