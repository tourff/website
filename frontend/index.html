<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turjo Site | Premium Digital Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0b0e14; font-family: 'Inter', sans-serif; }
        .glass-card { 
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .glass-card:hover {
            border-color: #f43f5e;
            transform: scale(1.03);
            box-shadow: 0 15px 35px rgba(244, 63, 94, 0.15);
        }
        .nav-glass {
            background: rgba(15, 18, 26, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="text-gray-100">

    <nav class="nav-glass sticky top-0 z-50 p-4">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-white p-2 rounded-xl">
                    <i class="fas fa-layer-group text-black text-xl"></i>
                </div>
                <span class="text-xl font-black tracking-tighter uppercase">TURJO SITE</span>
            </div>
            <div class="flex items-center gap-6">
                <div class="hidden md:flex relative">
                    <input type="text" placeholder="Search product..." class="bg-[#161b26] border border-gray-700 rounded-full px-5 py-2 text-sm w-72 focus:outline-none focus:border-pink-500 transition">
                    <i class="fas fa-search absolute right-4 top-3 text-gray-500"></i>
                </div>
                <a href="admin.html" class="text-xs font-medium text-gray-400 hover:text-white transition">ADMIN</a>
                <button class="bg-[#db2777] hover:bg-[#be185d] px-5 py-2 rounded-xl font-bold flex items-center gap-2 transition shadow-lg shadow-pink-900/20">
                    <i class="fas fa-shopping-basket"></i> ৳0
                </button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-12">
        <div class="flex flex-col mb-10">
            <h2 class="text-2xl font-bold border-l-4 border-pink-500 pl-4 mb-2">All Products</h2>
            <p class="text-gray-500 text-xs pl-5">Premium digital services & accounts</p>
        </div>
        
        <div id="products-container" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-6">
            <div class="h-64 glass-card animate-pulse rounded-2xl"></div>
            <div class="h-64 glass-card animate-pulse rounded-2xl"></div>
            <div class="h-64 glass-card animate-pulse rounded-2xl"></div>
        </div>
    </main>

    <footer class="py-10 text-center text-gray-600 text-xs border-t border-gray-900 mt-20">
        &copy; 2026 Turjo Site. All Rights Reserved.
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
