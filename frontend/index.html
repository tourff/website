<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turjo Site | Premium Digital Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0d0915; color: white; scroll-behavior: smooth; }
        .nav-bg { background: #161021; border-bottom: 1px solid #251d33; }
        .search-box { background: #1e162e; border: 1px solid #2d2341; }
        .card-bg { background: #161021; border: 1px solid #251d33; }
        .badge-rose { background: #f43f5e; color: white; border-radius: 4px; }
        .cart-btn { background: linear-gradient(90deg, #9333ea, #db2777); }
        .slider-img { min-width: 100%; object-fit: cover; height: 100%; }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #f43f5e; border-radius: 10px; }
    </style>
</head>
<body>

    <nav class="nav-bg sticky top-0 z-50 py-3">
        <div class="container mx-auto px-4 flex items-center justify-between gap-4">
            <div class="flex items-center gap-2 shrink-0 cursor-pointer active:scale-95 transition" onclick="window.location.reload()">
                <div class="w-10 h-10 bg-white rounded-lg flex items-center justify-center shadow-lg">
                    <i class="fas fa-bolt text-black text-xl"></i>
                </div>
                <div class="hidden md:block">
                    <h1 class="font-bold text-lg leading-tight uppercase tracking-tighter">Turjo Site</h1>
                    <p class="text-[9px] text-gray-500 uppercase tracking-widest">Premium Store</p>
                </div>
            </div>

            <div class="flex-1 max-w-xl relative hidden md:block group">
                <input type="text" id="search-input" onkeyup="searchProducts()" placeholder="Search for ChatGPT, Canva, Netflix..." 
                    class="w-full search-box py-2.5 px-10 rounded-lg outline-none text-sm focus:border-rose-500 transition text-white">
                <i class="fas fa-search absolute left-3.5 top-3.5 text-gray-500 text-xs group-focus-within:text-rose-500"></i>
            </div>

            <div class="flex items-center gap-4 text-xs font-semibold">
                <a href="#" class="hidden lg:flex items-center gap-2 hover:text-rose-500 transition">
                    <i class="fas fa-headset"></i> Support
                </a>
                
                <button class="cart-btn px-4 py-2.5 rounded-lg flex items-center gap-2 shadow-lg shadow-pink-500/20 text-white">
                    <i class="fas fa-shopping-cart"></i> ৳0
                </button>

                <div id="auth-nav" class="border-l border-white/10 pl-4">
                    <a href="login.html" class="flex items-center gap-2 hover:text-rose-500">
                        <i class="far fa-user text-lg"></i> Login
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-4 mt-6">
        <div class="relative w-full h-[160px] md:h-[350px] overflow-hidden rounded-[2rem] border border-white/5">
            <div id="slider" class="flex transition-transform duration-700 ease-in-out h-full">
                <img src="https://i.ibb.co/vYm6p6n/banner1.jpg" class="slider-img" alt="Special Offer 1">
                <img src="https://i.ibb.co/M9S9p9n/banner2.jpg" class="slider-img" alt="Special Offer 2">
            </div>
            <button onclick="prevSlide()" class="absolute left-4 top-1/2 -translate-y-1/2 bg-black/40 hover:bg-rose-600 p-3 rounded-full transition text-white">
                <i class="fas fa-chevron-left"></i>
            </button>
            <button onclick="nextSlide()" class="absolute right-4 top-1/2 -translate-y-1/2 bg-black/40 hover:bg-rose-600 p-3 rounded-full transition text-white">
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>
    </div>

    <main class="container mx-auto px-4 py-10">
        <div class="flex flex-col md:flex-row md:items-center justify-between mb-10 gap-4">
            <div>
                <h2 class="text-2xl font-bold uppercase tracking-tight">All Products</h2>
                <p id="item-count" class="text-xs text-gray-500 mt-1">0 items</p>
            </div>
            
            <div class="relative min-w-[200px]">
                <select id="sort-filter" onchange="sortProducts()" 
                    class="w-full bg-[#161021] border border-[#251d33] p-3 px-5 rounded-xl text-xs cursor-pointer outline-none appearance-none text-gray-300 hover:border-rose-500 transition">
                    <option value="default">Default Sorting</option>
                    <option value="low-high">Price: Lowest to Highest</option>
                    <option value="high-low">Price: Highest to Lowest</option>
                </select>
                <i class="fas fa-chevron-down absolute right-4 top-4 text-[8px] text-gray-500 pointer-events-none"></i>
            </div>
        </div>

        <div id="products-container" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 md:gap-8">
            </div>
    </main>

    <div class="fixed bottom-8 right-8 flex flex-col gap-4 z-50">
        <a href="https://t.me/your_telegram" target="_blank" class="w-14 h-14 bg-sky-500 rounded-full flex items-center justify-center text-white shadow-2xl hover:scale-110 transition shadow-sky-500/20">
            <i class="fab fa-telegram-plane text-2xl"></i>
        </a>
        <a href="https://wa.me/8801XXXXXXXXX" target="_blank" class="w-14 h-14 bg-green-500 rounded-full flex items-center justify-center text-white shadow-2xl hover:scale-110 transition shadow-green-500/20">
            <i class="fab fa-whatsapp text-3xl"></i>
        </a>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
