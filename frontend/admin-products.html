<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management | Turjo Site Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; transition: background-color 0.3s, color 0.3s; overflow-x: hidden; }
        
        /* সাইডবার ট্রানজিশন লজিক */
        #main-sidebar { transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); white-space: nowrap; }
        #main-sidebar.minimized { width: 85px; padding: 24px 12px; }
        #main-sidebar.minimized .sidebar-logo h1, #main-sidebar.minimized .sidebar-logo p, 
        #main-sidebar.minimized nav span, #main-sidebar.minimized .badge-new, 
        #main-sidebar.minimized .menu-label { display: none; }
        #main-sidebar.minimized .sidebar-item { justify-content: center; padding: 12px 0; }
        #main-sidebar.minimized .sidebar-item i { margin: 0; font-size: 18px; }

        /* কমন স্টাইল */
        body { background-color: #f8fafc; color: #1e293b; }
        .sidebar-item { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-radius: 12px; transition: 0.3s; color: #64748b; font-size: 13px; font-weight: 600; cursor: pointer; border: none; background: transparent; width: 100%; text-align: left; }
        .sidebar-item:hover { background: #f1f5f9; color: #2563eb; }
        .sidebar-item.active { background: #f1f5f9; color: #2563eb; }
        
        .glass-card { background: white; border: 1px solid #e2e8f0; border-radius: 24px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); transition: 0.3s; }
        .badge-new { background: #22c55e; color: white; font-size: 8px; padding: 2px 6px; border-radius: 20px; font-weight: 800; margin-left: auto; }
        
        /* ডার্ক মোড */
        .dark body { background-color: #0d0915 !important; color: #f8fafc !important; }
        .dark aside, .dark header { background-color: #161021 !important; border-color: rgba(255, 255, 255, 0.05) !important; }
        .dark .glass-card { background: rgba(22, 16, 33, 0.7) !important; border-color: rgba(255, 255, 255, 0.05) !important; }
        .dark .sidebar-item { color: #94a3b8; }
        .dark .sidebar-item:hover, .dark .sidebar-item.active { background: #1e162e !important; color: #f43f5e !important; }
    </style>
</head>
<body class="flex min-h-screen transition-all">

    <aside id="main-sidebar" class="w-64 bg-white border-r border-slate-200 p-6 flex flex-col sticky top-0 h-screen overflow-y-auto z-[60]">
        <div class="flex items-center justify-between mb-10 px-2 sidebar-header">
            <div class="sidebar-logo text-left">
                <h1 class="font-extrabold text-lg tracking-tighter text-blue-600 dark:text-rose-500 uppercase">Admin Panel</h1>
                <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Premium Collection</p>
            </div>
            <button id="sidebar-toggle" class="w-8 h-8 flex items-center justify-center bg-slate-50 dark:bg-slate-800 rounded-lg hover:bg-blue-100 dark:hover:bg-rose-900/20 transition">
                <i id="toggle-icon" class="fas fa-chevron-left text-slate-400 text-xs"></i>
            </button>
        </div>

        <div class="space-y-6 text-left">
            <div>
                <p class="menu-label text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3 px-4">Main</p>
                <nav class="space-y-1">
                    <button class="sidebar-item" onclick="location.href='admin.html'"><i class="fas fa-th-large"></i> <span>Dashboard</span></button>
                    <button class="sidebar-item"><i class="fas fa-chart-pie"></i> <span>Analytics</span></button>
                    <button class="sidebar-item"><i class="fas fa-file-alt"></i> <span>Reports</span></button>
                    <button class="sidebar-item active" onclick="location.href='admin-products.html'"><i class="fas fa-box"></i> <span>Products</span></button>
                </nav>
            </div>

            <div>
                <p class="menu-label text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3 px-4">Hubs</p>
                <nav class="space-y-1">
                    <button class="sidebar-item"><i class="fas fa-layer-group text-blue-500"></i> <span>Operations Hub</span> <span class="badge-new">NEW</span></button>
                    <button class="sidebar-item"><i class="fas fa-briefcase text-orange-500"></i> <span>Business Hub</span> <span class="badge-new">NEW</span></button>
                    <button class="sidebar-item"><i class="fas fa-bullhorn text-purple-500"></i> <span>Marketing Hub</span> <span class="badge-new">NEW</span></button>
                </nav>
            </div>

            <div>
                <p class="menu-label text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3 px-4">System</p>
                <nav class="space-y-1">
                    <button class="sidebar-item"><i class="fas fa-shield-virus text-teal-500"></i> <span>Fraud Control</span> <span class="badge-new">NEW</span></button>
                    <button class="sidebar-item"><i class="fas fa-user-cog text-slate-500"></i> <span>User Intelligence</span> <span class="badge-new">NEW</span></button>
                    <button onclick="handleAdminLogout()" class="sidebar-item text-rose-500"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></button>
                </nav>
            </div>
        </div>
    </aside>

    <main class="flex-1 overflow-x-hidden transition-all">
        <header class="bg-white border-b border-slate-200 p-6 sticky top-0 z-50 transition-all dark:bg-[#161021]">
            <div class="flex justify-between items-center text-left">
                <div>
                    <h2 class="text-3xl font-black text-slate-800 dark:text-white">Product Inventory</h2>
                    <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mt-1">Manage your stock and collection</p>
                </div>
                <div class="flex items-center gap-4">
                    <button onclick="toggleModal()" class="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold text-xs uppercase tracking-widest shadow-lg shadow-blue-500/20">
                        <i class="fas fa-plus mr-2"></i> Add Product
                    </button>
                    <button id="theme-toggle" class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-[#1e162e] flex items-center justify-center">
                        <i id="theme-icon" class="fas fa-moon text-slate-600 dark:text-yellow-400"></i>
                    </button>
                </div>
            </div>
        </header>

        <div class="p-6">
            <section class="glass-card p-6 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="border-b dark:border-slate-800">
                                <th class="py-4 px-2 text-[10px] font-black text-slate-400 uppercase">Product Details</th>
                                <th class="py-4 px-2 text-[10px] font-black text-slate-400 uppercase">Pricing</th>
                                <th class="py-4 px-2 text-[10px] font-black text-slate-400 uppercase">Stock Status</th>
                                <th class="py-4 px-2 text-[10px] font-black text-slate-400 uppercase text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="inventory-list" class="divide-y divide-slate-50 dark:divide-slate-800/50">
                            </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <div id="p-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-[#161021] w-full max-w-md rounded-[2.5rem] p-10 shadow-2xl">
            <h3 id="modal-title" class="text-2xl font-black mb-6 text-left dark:text-white">Product Details</h3>
            <form id="inventory-form" class="space-y-4 text-left">
                <input type="hidden" id="edit-id">
                <input type="text" id="p-name" placeholder="Product Name" class="w-full bg-slate-100 dark:bg-slate-800 p-4 rounded-xl outline-none text-sm dark:text-white" required>
                <div class="grid grid-cols-2 gap-4">
                    <input type="number" id="p-price" placeholder="Sale Price" class="bg-slate-100 dark:bg-slate-800 p-4 rounded-xl outline-none text-sm dark:text-white" required>
                    <input type="number" id="p-oldPrice" placeholder="Old Price" class="bg-slate-100 dark:bg-slate-800 p-4 rounded-xl outline-none text-sm dark:text-white">
                </div>
                <input type="number" id="p-stock" placeholder="Stock Quantity" class="w-full bg-slate-100 dark:bg-slate-800 p-4 rounded-xl outline-none text-sm dark:text-white" required>
                <input type="text" id="p-image" placeholder="Image URL (e.g. https://...)" class="w-full bg-slate-100 dark:bg-slate-800 p-4 rounded-xl outline-none text-sm dark:text-white" required>
                <textarea id="p-desc" placeholder="Description" class="w-full bg-slate-100 dark:bg-slate-800 p-4 rounded-xl outline-none text-sm h-24 dark:text-white"></textarea>
                <div class="flex gap-4 pt-4">
                    <button type="button" onclick="toggleModal()" class="flex-1 font-bold text-xs text-slate-400 uppercase">Cancel</button>
                    <button type="submit" class="flex-1 bg-blue-600 text-white py-4 rounded-xl font-bold text-xs uppercase tracking-widest shadow-lg hover:bg-blue-700 transition">Save Product</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // সাইডবার লজিক
        const sidebar = document.getElementById('main-sidebar');
        const toggleBtn = document.getElementById('sidebar-toggle');
        const toggleIcon = document.getElementById('toggle-icon');

        toggleBtn.onclick = () => {
            sidebar.classList.toggle('minimized');
            const isMinimized = sidebar.classList.contains('minimized');
            toggleIcon.classList.replace(isMinimized ? 'fa-chevron-left' : 'fa-chevron-right', isMinimized ? 'fa-chevron-right' : 'fa-chevron-left');
            localStorage.setItem('sidebar-minimized', isMinimized);
        };

        if (localStorage.getItem('sidebar-minimized') === 'true') {
            sidebar.classList.add('minimized');
            toggleIcon.classList.replace('fa-chevron-left', 'fa-chevron-right');
        }

        // থিম টগল
        const themeBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
            themeIcon.className = 'fas fa-sun text-yellow-400';
        }
        
        themeBtn.onclick = () => {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.className = isDark ? 'fas fa-sun text-yellow-400' : 'fas fa-moon text-slate-600';
        };

        // মডাল ফাংশন
        function toggleModal() {
            document.getElementById('p-modal').classList.toggle('hidden');
            if(document.getElementById('p-modal').classList.contains('hidden')) {
                document.getElementById('inventory-form').reset();
                document.getElementById('edit-id').value = '';
            }
        }

        function handleAdminLogout() {
            if(confirm("Are you sure you want to logout?")) {
                window.location.href = 'admin-login.html';
            }
        }
    </script>
    <script src="js/admin-products.js"></script>
</body>
</html>
