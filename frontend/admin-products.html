<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management | Prime Products BD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; transition: 0.3s; overflow-x: hidden; }
        
        /* Permanent Sidebar Smooth Transition */
        #main-sidebar {
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
        }

        #main-sidebar.minimized {
            width: 85px;
            padding: 24px 12px;
        }

        #main-sidebar.minimized .sidebar-logo,
        #main-sidebar.minimized nav span,
        #main-sidebar.minimized .badge-new,
        #main-sidebar.minimized .menu-label {
            display: none;
        }

        #main-sidebar.minimized .sidebar-item {
            justify-content: center;
            padding: 12px 0;
        }

        .sidebar-item { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-radius: 12px; transition: 0.3s; color: #64748b; font-size: 13px; font-weight: 600; cursor: pointer; }
        .sidebar-item:hover, .sidebar-item.active { background: #f1f5f9; color: #2563eb; }

        .dark body { background-color: #0d0915; color: white; }
        .glass-card { background: white; border: 1px solid #e2e8f0; border-radius: 24px; transition: 0.3s; }
        .dark .glass-card { background: rgba(22, 16, 33, 0.7); border-color: rgba(255, 255, 255, 0.05); }
        .dark .sidebar-item { color: #94a3b8; }
        .dark .sidebar-item:hover, .dark .sidebar-item.active { background: #1e162e !important; color: #f43f5e !important; }
        .badge-new { background: #22c55e; color: white; font-size: 8px; padding: 2px 6px; border-radius: 20px; font-weight: 800; margin-left: auto; }
    </style>
</head>
<body class="flex min-h-screen transition-all">

    <aside id="main-sidebar" class="w-64 bg-white border-r border-slate-200 p-6 flex flex-col sticky top-0 h-screen overflow-y-auto z-[60] dark:bg-[#161021]">
        <div class="flex items-center justify-between mb-10 px-2 sidebar-header">
            <div class="sidebar-logo text-left">
                <h1 class="font-extrabold text-lg tracking-tighter text-blue-600 dark:text-rose-500 uppercase">PHB Admin</h1>
            </div>
            <button id="sidebar-toggle" class="w-8 h-8 flex items-center justify-center bg-slate-50 dark:bg-slate-800 rounded-lg">
                <i id="toggle-icon" class="fas fa-chevron-left text-slate-400 text-xs"></i>
            </button>
        </div>

        <div class="space-y-6 text-left">
            <nav class="space-y-1">
                <div class="sidebar-item" onclick="navigate('admin.html')"><i class="fas fa-th-large"></i> <span>Dashboard</span></div>
                <div class="sidebar-item active"><i class="fas fa-box"></i> <span>Products</span></div>
                <div class="sidebar-item" onclick="navigate('admin-orders.html')"><i class="fas fa-shopping-cart"></i> <span>Orders</span></div>
                <div id="side-intelligence" class="sidebar-item" onclick="navigate('admin-intelligence.html')"><i class="fas fa-user-cog"></i> <span>User Intelligence</span></div>
                <button onclick="handleAdminLogout()" class="sidebar-item text-rose-500 w-full"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></button>
            </nav>
        </div>
    </aside>

    <main class="flex-1 overflow-x-hidden p-8 lg:p-12">
        <header class="flex justify-between items-center mb-10 text-left">
            <div>
                <p class="text-slate-400 font-bold text-[10px] uppercase tracking-widest mb-1">Stock & Inventory</p>
                <h1 class="text-3xl font-black text-left">Product Inventory</h1>
            </div>
            <button onclick="toggleModal()" class="bg-blue-600 text-white px-8 py-3 rounded-2xl font-bold text-xs uppercase tracking-widest shadow-lg shadow-blue-500/30">
                <i class="fas fa-plus mr-2"></i> Add Product
            </button>
        </header>

        <section class="glass-card p-8">
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="border-b dark:border-slate-800">
                            <th class="py-4 px-2 text-[10px] font-black text-slate-400 uppercase text-left">Product Details</th>
                            <th class="py-4 px-2 text-[10px] font-black text-slate-400 uppercase text-left">Pricing</th>
                            <th class="py-4 px-2 text-[10px] font-black text-slate-400 uppercase text-left">Stock Status</th>
                            <th class="py-4 px-2 text-[10px] font-black text-slate-400 uppercase text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="inventory-list"></tbody>
                </table>
            </div>
        </section>
    </main>

    <div id="p-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-[#161021] w-full max-w-md rounded-[2.5rem] p-10 shadow-2xl">
            <h3 id="modal-title" class="text-2xl font-black mb-6 text-left">Product Details</h3>
            <form id="inventory-form" class="space-y-4 text-left">
                <input type="hidden" id="edit-id">
                <input type="text" id="p-name" placeholder="Product Name" class="w-full bg-slate-100 dark:bg-slate-800 p-4 rounded-xl outline-none text-sm" required>
                <div class="grid grid-cols-2 gap-4">
                    <input type="number" id="p-price" placeholder="Sale Price (৳)" class="bg-slate-100 dark:bg-slate-800 p-4 rounded-xl outline-none text-sm" required>
                    <input type="number" id="p-oldPrice" placeholder="Old Price (৳)" class="bg-slate-100 dark:bg-slate-800 p-4 rounded-xl outline-none text-sm">
                </div>
                <input type="number" id="p-stock" placeholder="Stock Quantity" class="w-full bg-slate-100 dark:bg-slate-800 p-4 rounded-xl outline-none text-sm" required>
                <input type="text" id="p-image" placeholder="Image URL" class="w-full bg-slate-100 dark:bg-slate-800 p-4 rounded-xl outline-none text-sm" required>
                <textarea id="p-desc" placeholder="Product Description" class="w-full bg-slate-100 dark:bg-slate-800 p-4 rounded-xl outline-none text-sm h-24"></textarea>
                <div class="flex gap-4 pt-4">
                    <button type="button" onclick="toggleModal()" class="flex-1 font-bold text-xs text-slate-400 uppercase">Cancel</button>
                    <button type="submit" class="flex-1 bg-blue-600 text-white py-4 rounded-xl font-bold text-xs uppercase tracking-widest shadow-lg">Save Product</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const sidebar = document.getElementById('main-sidebar');
        const toggleBtn = document.getElementById('sidebar-toggle');
        const toggleIcon = document.getElementById('toggle-icon');

        if (localStorage.getItem('sidebar-minimized') === 'true') {
            sidebar.classList.add('minimized');
            toggleIcon.classList.replace('fa-chevron-left', 'fa-chevron-right');
        }

        toggleBtn.onclick = () => {
            sidebar.classList.toggle('minimized');
            const isMinimized = sidebar.classList.contains('minimized');
            if (isMinimized) toggleIcon.classList.replace('fa-chevron-left', 'fa-chevron-right');
            else toggleIcon.classList.replace('fa-chevron-right', 'fa-chevron-left');
            localStorage.setItem('sidebar-minimized', isMinimized);
        };

        function navigate(page) {
            sessionStorage.setItem('adminAuth', "turjo0424");
            window.location.href = page;
        }

        function handleAdminLogout() {
            if(confirm("Are you sure?")) {
                sessionStorage.removeItem('adminAuth'); 
                window.location.href = 'admin-login.html'; 
            }
        }
    </script>
    <script src="js/admin-products.js"></script>
    <script>if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');</script>
</body>
</html>
