<div id="main-content">
    <div class="flex justify-between items-center mb-8">
        <h2 class="text-2xl font-black">Product Inventory</h2>
        <button onclick="toggleModal()" class="bg-blue-600 text-white px-6 py-2 rounded-xl text-xs font-bold uppercase">Add Product</button>
    </div>
    <div class="glass-card p-6">
        <table class="w-full text-left">
            <thead>
                <tr class="border-b dark:border-slate-800 text-[10px] text-slate-400 uppercase">
                    <th class="py-4">Product</th>
                    <th class="py-4">Price</th>
                    <th class="py-4 text-right">Actions</th>
                </tr>
            </thead>
            <tbody id="inventory-list"></tbody>
        </table>
    </div>

    <div id="p-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-[100]">
        <div class="bg-white dark:bg-[#161021] p-10 rounded-[2rem] w-80">
            <h3 class="font-bold mb-4">Add New Product</h3>
            <input type="text" id="p-name" placeholder="Name" class="w-full p-3 mb-3 bg-slate-100 dark:bg-slate-800 rounded-lg">
            <button onclick="toggleModal()" class="w-full bg-blue-600 text-white py-3 rounded-lg">Save</button>
        </div>
    </div>
</div>
