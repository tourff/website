<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Prime Products BD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; transition: 0.3s; overflow-x: hidden; }
        
        /* ১. উন্নত সাইডবার ট্রানজিশন লজিক */
        #main-sidebar {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
        }

        #main-sidebar.minimized {
            width: 80px;
            padding: 24px 12px;
        }

        /* মিনিমাইজ অবস্থায় টেক্সট হাইড করা */
        #main-sidebar.minimized span, 
        #main-sidebar.minimized .menu-label,
        #main-sidebar.minimized .sidebar-logo h1,
        #main-sidebar.minimized .badge-new {
            display: none;
        }

        #main-sidebar.minimized .sidebar-item {
            justify-content: center;
            padding: 12px 0;
            width: 100%;
        }

        /* সাইডবার আইটেম ডিজাইন */
        .sidebar-item { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            padding: 12px 16px; 
            border-radius: 14px; 
            transition: 0.3s; 
            color: #64748b; 
            font-size: 13px; 
            font-weight: 600; 
            cursor: pointer;
            margin-bottom: 4px;
        }

        .sidebar-item:hover {
            background: #f1f5f9;
            color: #2563eb;
        }

        .sidebar-item.active {
            background: #2563eb;
            color: white;
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.2);
        }

        .menu-label {
            font-size: 10px;
            font-weight: 800;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 20px 0 10px 15px;
        }

        .badge-new {
            background: #10b981;
            color: white;
            font-size: 8px;
            padding: 2px 6px;
            border-radius: 20px;
            margin-left: auto;
        }

        /* ডার্ক মোড সাপোর্ট */
        .dark body { background-color: #0f172a; color: #f8fafc; }
        .dark aside { background-color: #1e293b; border-color: rgba(255,255,255,0.05); }
        .dark header { background-color: #1e293b; border-color: rgba(255,255,255,0.05); }
        .dark .sidebar-item:hover { background: #334155; color: #60a5fa; }
        .dark .sidebar-item.active { background: #3b82f6; color: white; }
    </style>
</head>
<body class="flex min-h-screen transition-all">

    <aside id="main-sidebar" class="w-64 bg-white border-r border-slate-200 p-6 flex flex-col sticky top-0 h-screen overflow-y-auto z-[60]">
        
        <div class="flex items-center justify-between mb-8 px-2">
            <div class="sidebar-logo flex items-center gap-2">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
                    <i class="fas fa-cube text-white text-sm"></i>
                </div>
                <h1 class="font-black text-lg tracking-tight text-slate-800 dark:text-white uppercase">PHB Admin</h1>
            </div>
            <button id="sidebar-toggle" class="w-8 h-8 flex items-center justify-center bg-slate-50 dark:bg-slate-800 rounded-lg hover:bg-slate-100 transition">
                <i id="toggle-icon" class="fas fa-bars text-slate-400 text-xs"></i>
            </button>
        </div>

        <div class="flex-1 overflow-y-auto text-left">
            <p class="menu-label">Analytics</p>
            <div class="sidebar-item active">
                <i class="fas fa-th-large"></i> <span>Dashboard</span>
            </div>
            <div class="sidebar-item">
                <i class="fas fa-chart-pie"></i> <span>Real-time Pulse</span>
                <span class="badge-new">LIVE</span>
            </div>

            <p class="menu-label">Management</p>
            <div class="sidebar-item">
                <i class="fas fa-box"></i> <span>Inventory</span>
            </div>
            <div class="sidebar-item">
                <i class="fas fa-shopping-cart"></i> <span>Orders</span>
            </div>
            <div class="sidebar-item">
                <i class="fas fa-users"></i> <span>Customers</span>
            </div>

            <p class="menu-label">Security</p>
            <div class="sidebar-item">
                <i class="fas fa-shield-halved"></i> <span>Fraud Control</span>
            </div>
            <div class="sidebar-item">
                <i class="fas fa-brain"></i> <span>User Intelligence</span>
            </div>
        </div>

        <div class="mt-auto pt-6 border-t border-slate-100 dark:border-slate-800">
            <div onclick="handleAdminLogout()" class="sidebar-item text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-500/10">
                <i class="fas fa-power-off"></i> <span>Sign Out</span>
            </div>
        </div>
    </aside>

    <main class="flex-1 transition-all">
        <header class="bg-white/80 backdrop-blur-md border-b border-slate-200 p-6 sticky top-0 z-50 dark:bg-slate-900/80">
            <div class="flex justify-between items-center">
                <div class="text-left">
                    <h2 class="text-2xl font-black text-slate-800 dark:text-white">Dashboard Overview</h2>
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">Prime Products BD System</p>
                </div>
                <div class="flex items-center gap-3">
                    <button id="theme-toggle" class="w-10 h-10 rounded-xl bg-slate-50 dark:bg-slate-800 flex items-center justify-center border border-slate-100 dark:border-slate-700">
                        <i id="theme-icon" class="fas fa-moon text-slate-600 dark:text-yellow-400"></i>
                    </button>
                    <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white font-bold">A</div>
                </div>
            </div>
        </header>

        <div class="p-8">
            <div class="glass-card p-12 text-center border-dashed border-2 border-slate-200 dark:border-slate-800">
                <i class="fas fa-folder-open text-slate-300 text-5xl mb-4"></i>
                <h1 class="text-xl font-bold text-slate-400 uppercase tracking-widest">Dashboard Content Area</h1>
            </div>
        </div>
    </main>

    <script>
        // সাইডবার টগল স্ক্রিপ্ট
        const sidebar = document.getElementById('main-sidebar');
        const toggleBtn = document.getElementById('sidebar-toggle');
        const toggleIcon = document.getElementById('toggle-icon');

        toggleBtn.onclick = () => {
            sidebar.classList.toggle('minimized');
            const isMinimized = sidebar.classList.contains('minimized');
            
            // আইকন পরিবর্তন
            if (isMinimized) {
                toggleIcon.className = 'fas fa-indent text-slate-400 text-xs';
            } else {
                toggleIcon.className = 'fas fa-bars text-slate-400 text-xs';
            }
            localStorage.setItem('sidebar-minimized', isMinimized);
        };

        if (localStorage.getItem('sidebar-minimized') === 'true') {
            sidebar.classList.add('minimized');
            toggleIcon.className = 'fas fa-indent text-slate-400 text-xs';
        }
    </script>
</body>
</html>
