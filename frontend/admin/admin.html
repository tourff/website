<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Products Hub BD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0712; color: white; overflow-x: hidden; }
        .glass-sidebar { background: #161021; border-right: 1px solid rgba(255, 255, 255, 0.05); }
        .glass-card { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); }
        .menu-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; transition: 0.3s; color: #9ca3af; font-size: 11px; font-weight: 800; text-transform: uppercase; cursor: pointer; }
        .menu-item:hover, .menu-item.active { background: rgba(255, 255, 255, 0.05); color: #f43f5e; border: 1px solid rgba(244, 63, 94, 0.2); }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #f43f5e; border-radius: 10px; }
    </style>
</head>
<body class="flex min-h-screen">

    <aside class="glass-sidebar w-64 hidden lg:flex flex-col p-6 sticky top-0 h-screen z-50 overflow-y-auto">
        <div class="flex items-center gap-3 mb-10">
            <div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center shadow-lg"><i class="fas fa-bolt text-black text-xl"></i></div>
            <h1 class="font-black uppercase tracking-tighter text-white">Admin</h1>
        </div>

        <nav class="flex flex-col gap-2">
            <p class="text-[9px] text-gray-600 font-black uppercase tracking-widest mb-2 px-2">Main Menu</p>
            <div onclick="showSection('dashboard')" class="menu-item active" id="m-dashboard"><i class="fas fa-th-large"></i> Dashboard</div>
            <div onclick="showSection('products')" class="menu-item" id="m-products"><i class="fas fa-box"></i> Products</div>
            <div onclick="showSection('orders')" class="menu-item" id="m-orders"><i class="fas fa-shopping-bag"></i> Orders</div>
            <button onclick="handleAdminLogout()" class="menu-item text-rose-500 mt-10"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </nav>
    </aside>

    <main id="admin-main-content" class="flex-1 p-6 md:p-12 hidden">
        
        <section id="sec-dashboard">
            <header class="mb-12">
                <h2 class="text-4xl font-black tracking-tighter">Command Center</h2>
            </header>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-12">
                <div class="glass-card p-8 rounded-[2.5rem]"><p class="text-[9px] text-gray-500 uppercase font-black mb-1">Revenue</p><h3 id="total-revenue" class="text-3xl font-black text-white">৳0</h3></div>
                <div class="glass-card p-8 rounded-[2.5rem]"><p class="text-[9px] text-gray-500 uppercase font-black mb-1">Orders</p><h3 id="order-count" class="text-3xl font-black text-white">0</h3></div>
                <div class="glass-card p-8 rounded-[2.5rem]"><p class="text-[9px] text-gray-500 uppercase font-black mb-1">Products</p><h3 id="product-count" class="text-3xl font-black text-white">0</h3></div>
                <div class="glass-card p-8 rounded-[2.5rem]"><p class="text-[9px] text-gray-500 uppercase font-black mb-1">Daily Sales</p><h3 id="today-sales" class="text-3xl font-black text-green-500">৳0</h3></div>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                <div class="lg:col-span-8 glass-card p-10 rounded-[3rem] h-96"><canvas id="revenueChart"></canvas></div>
                <div class="lg:col-span-4 glass-card p-10 rounded-[3rem]"><h4 class="text-[10px] uppercase text-gray-500 mb-8">Recent Activity</h4><div id="orders-list-mini" class="space-y-6"></div></div>
            </div>
        </section>

        <section id="sec-products" class="hidden">
            <div class="flex justify-between items-center mb-10">
                <h2 class="text-4xl font-black tracking-tighter">Manage Products</h2>
                <button onclick="toggleModal('add-modal')" class="bg-rose-500 px-6 py-3 rounded-xl font-bold text-xs uppercase tracking-widest">Add Product</button>
            </div>
            <div class="glass-card rounded-[2.5rem] overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-white/5 text-[10px] font-black text-gray-500 uppercase"><tr><th class="p-6">Product</th><th class="p-6">Price</th><th class="p-6 text-right">Actions</th></tr></thead>
                    <tbody id="full-product-list"></tbody>
                </table>
            </div>
        </section>

        <section id="sec-orders" class="hidden">
            <h2 class="text-4xl font-black tracking-tighter mb-10">All Orders</h2>
            <div id="full-orders-list" class="grid gap-4"></div>
        </section>

    </main>

    <div id="add-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden z-[100] flex items-center justify-center p-4">
        <div class="glass-card w-full max-w-lg p-10 rounded-[3rem]">
            <h3 class="text-xl font-black uppercase mb-8">Add New Product</h3>
            <form id="add-product-form" class="space-y-4">
                <input type="text" id="add-name" placeholder="Name" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none">
                <div class="grid grid-cols-2 gap-4">
                    <input type="number" id="add-price" placeholder="Price" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none">
                    <input type="number" id="add-oldPrice" placeholder="Old Price" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none">
                </div>
                <input type="text" id="add-image" placeholder="Image URL" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none">
                <button type="submit" class="w-full bg-rose-500 py-4 rounded-2xl font-bold uppercase text-[10px]">Save Product</button>
            </form>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
