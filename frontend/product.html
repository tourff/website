<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | Turjo Site</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0712; color: white; }
        .glass-card { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .active-tab { border-bottom: 3px solid #f43f5e; color: #f43f5e; }
        .btn-gradient { background: linear-gradient(90deg, #9333ea, #db2777); }
        .whatsapp-btn { background: #25d366; box-shadow: 0 10px 20px rgba(37, 211, 102, 0.2); }
    </style>
</head>
<body class="min-h-screen">

    <div class="container mx-auto px-4 py-10 lg:py-20">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-12">
            
            <div class="lg:col-span-7 space-y-8">
                <div class="glass-card rounded-[2.5rem] p-12 flex flex-col items-center relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-rose-500 to-transparent opacity-30"></div>
                    <img id="p-image" src="" class="w-full max-w-sm object-contain drop-shadow-2xl transition-transform duration-500 hover:scale-105">
                    
                    <div class="grid grid-cols-3 w-full border-t border-white/5 mt-10 pt-8 text-center">
                        <div class="group cursor-default">
                            <p id="p-sold" class="text-xl font-extrabold tracking-tighter">0+</p>
                            <p class="text-[10px] text-gray-500 uppercase font-bold tracking-widest mt-1">Sold Items</p>
                        </div>
                        <div class="group cursor-default">
                            <p class="text-rose-500 text-xl"><i class="fas fa-heart animate-pulse"></i></p>
                            <p class="text-[10px] text-gray-500 uppercase font-bold tracking-widest mt-1">Loved by Users</p>
                        </div>
                        <div class="group cursor-default">
                            <p id="p-rating-stat" class="text-xl font-extrabold tracking-tighter">5.0</p>
                            <p class="text-[10px] text-gray-500 uppercase font-bold tracking-widest mt-1">Avg Rating</p>
                        </div>
                    </div>
                </div>

                <div class="glass-card rounded-[2rem] p-8">
                    <div class="flex gap-10 border-b border-white/5 mb-8">
                        <button class="active-tab pb-4 font-bold text-xs uppercase tracking-widest">Description</button>
                        <button class="text-gray-500 pb-4 font-bold text-xs uppercase tracking-widest hover:text-white transition">Reviews (1)</button>
                    </div>
                    <div id="p-desc" class="text-sm text-gray-400 leading-loose space-y-4">
                        </div>
                </div>
            </div>

            <div class="lg:col-span-5">
                <div class="glass-card rounded-[2.5rem] p-10 sticky top-10 border-white/10 shadow-2xl">
                    <h1 id="p-name" class="text-3xl font-black mb-3 tracking-tight leading-tight">Product Name</h1>
                    
                    <div class="flex items-center gap-3 mb-8">
                        <div id="p-stars" class="flex gap-1 text-[10px]">
                            </div>
                        <span id="p-review-count" class="text-[10px] text-gray-500 font-bold uppercase tracking-wider">(0 reviews)</span>
                    </div>

                    <div class="mb-10">
                        <div class="flex items-baseline gap-3">
                            <span id="p-price" class="text-4xl font-black text-rose-500 tracking-tighter">৳0</span>
                            <span id="p-old-price" class="text-lg text-gray-600 line-through font-bold"></span>
                        </div>
                        <p id="p-stock" class="text-[10px] text-green-500 mt-3 font-black uppercase tracking-widest flex items-center gap-2">
                            <span class="w-2 h-2 bg-green-500 rounded-full animate-ping"></span> In Stock (99 available)
                        </p>
                    </div>

                    <div class="space-y-6">
                        <div>
                            <label class="text-[10px] font-black text-gray-500 block mb-3 uppercase tracking-[0.2em]">Select Plan:</label>
                            <select class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none text-xs font-bold focus:border-rose-500 transition cursor-pointer">
                                <option class="bg-[#0b0712]">Standard Plan — 1 Month</option>
                                <option class="bg-[#0b0712]">Premium Plan — 12 Months</option>
                            </select>
                        </div>

                        <div class="flex items-center justify-between bg-white/5 border border-white/5 p-4 rounded-2xl">
                            <span class="text-[10px] font-black text-gray-500 uppercase tracking-widest">Quantity:</span>
                            <div class="flex items-center gap-6">
                                <button onclick="updateQuantity(-1)" class="w-8 h-8 rounded-full border border-white/10 flex items-center justify-center hover:bg-white/10 transition">-</button>
                                <span id="qty-value" class="font-black text-sm">1</span>
                                <button onclick="updateQuantity(1)" class="w-8 h-8 rounded-full border border-white/10 flex items-center justify-center hover:bg-rose-500 transition">+</button>
                            </div>
                        </div>

                        <button onclick="handleAddToCart()" class="w-full btn-gradient py-5 rounded-2xl font-black text-[11px] uppercase tracking-[0.2em] shadow-xl shadow-pink-900/20 active:scale-[0.98] transition">
                            <i class="fas fa-shopping-cart mr-2"></i> Add To Cart
                        </button>
                        
                        <button onclick="buyViaWhatsApp()" class="w-full whatsapp-btn py-5 rounded-2xl font-black text-[11px] uppercase tracking-[0.2em] flex items-center justify-center gap-2 text-white active:scale-[0.98] transition">
                            <i class="fab fa-whatsapp text-lg"></i> Buy via WhatsApp
                        </button>
                    </div>

                    <div class="mt-8 pt-8 border-t border-white/5 flex items-center gap-4">
                        <div class="w-10 h-10 rounded-full bg-blue-500/10 flex items-center justify-center text-blue-500"><i class="fas fa-bolt"></i></div>
                        <div>
                            <p class="text-[11px] font-black uppercase tracking-tighter">Instant Delivery</p>
                            <p class="text-[9px] text-gray-500">Via WhatsApp within minutes</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-32">
            <div class="flex items-baseline gap-4 mb-10">
                <h2 class="text-2xl font-black uppercase tracking-tighter">Related Products</h2>
                <div class="h-1 flex-1 bg-white/5 rounded-full"></div>
            </div>
            <div id="related-container" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-6">
                </div>
        </div>
    </div>

    <script src="js/product-details.js"></script>
</body>
</html>
