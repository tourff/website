<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | Turjo Site</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0d0915; color: white; font-family: sans-serif; }
        .glass-card { background: rgba(22, 16, 33, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .active-tab { border-bottom: 3px solid #db2777; color: white; }
    </style>
</head>
<body class="p-4 md:p-10">
    <div class="container mx-auto">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
            
            <div class="lg:col-span-7">
                <div class="glass-card rounded-3xl p-10 flex flex-col items-center">
                    <img id="p-image" src="" class="w-full max-w-sm object-contain mb-8">
                    <div class="grid grid-cols-3 w-full border-t border-white/5 pt-6 text-center">
                        <div><p id="p-sold" class="font-bold">0+</p><p class="text-[10px] text-gray-500">Sold</p></div>
                        <div><p class="font-bold text-rose-500"><i class="fas fa-heart"></i></p><p class="text-[10px] text-gray-500">Loved</p></div>
                        <div><p id="p-rating" class="font-bold">5.0</p><p class="text-[10px] text-gray-500">Rating</p></div>
                    </div>
                </div>

                <div class="mt-10 glass-card rounded-3xl p-6">
                    <div class="flex gap-8 border-b border-white/5 mb-6 pb-2">
                        <button class="active-tab font-bold text-sm">Description</button>
                        <button class="text-gray-500 text-sm">Reviews</button>
                    </div>
                    <p id="p-desc" class="text-xs text-gray-400 leading-relaxed"></p>
                </div>
            </div>

            <div class="lg:col-span-5">
                <div class="glass-card rounded-3xl p-8 sticky top-10">
                    <h1 id="p-name" class="text-2xl font-bold mb-2">Product Name</h1>
                    <div class="flex items-center gap-2 mb-6">
                        <span class="text-yellow-500 text-xs"><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i></span>
                        <span id="p-review-count" class="text-[10px] text-gray-500">(0 reviews)</span>
                    </div>

                    <div class="mb-6">
                        <p id="p-price" class="text-3xl font-black text-rose-500">৳0</p>
                        <p id="p-stock" class="text-[10px] text-green-500 mt-2 font-bold italic">● In Stock (99 available)</p>
                    </div>

                    <div class="space-y-4">
                        <div>
                            <label class="text-[10px] font-bold text-gray-500 block mb-2 uppercase tracking-widest">Select Plan:</label>
                            <select class="w-full bg-[#1e162e] border border-white/5 p-3 rounded-xl outline-none text-sm">
                                <option>Standard Plan — Monthly</option>
                                <option>Premium Plan — Yearly</option>
                            </select>
                        </div>

                        <div class="flex items-center justify-between bg-white/5 p-3 rounded-xl">
                            <span class="text-xs">Quantity:</span>
                            <div class="flex items-center gap-4">
                                <button class="text-gray-500">-</button>
                                <span class="font-bold text-sm">1</span>
                                <button class="text-rose-500">+</button>
                            </div>
                        </div>

                        <button class="w-full bg-gradient-to-r from-purple-600 to-pink-600 py-4 rounded-2xl font-bold text-xs uppercase tracking-widest shadow-lg shadow-pink-500/20 active:scale-95 transition">Add To Cart</button>
                        <button class="w-full bg-[#25d366] py-4 rounded-2xl font-bold text-xs uppercase tracking-widest flex items-center justify-center gap-2 text-white shadow-lg active:scale-95 transition"><i class="fab fa-whatsapp"></i> Buy Now via WhatsApp</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-20">
            <h2 class="text-xl font-bold mb-8 uppercase tracking-tighter">Related Products</h2>
            <div id="related-container" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-6">
                </div>
        </div>
    </div>

    <script src="js/product-details.js"></script>
</body>
</html>
