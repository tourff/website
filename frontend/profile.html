<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Profile | Turjo Site</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-[#0d0915] text-white font-sans min-h-screen">
    <div class="container mx-auto px-4 py-10 max-w-2xl">
        <a href="index.html" class="text-rose-500 text-sm mb-6 inline-block"><i class="fas fa-arrow-left"></i> Back to Home</a>
        
        <div class="bg-[#161021] p-8 rounded-3xl border border-white/5 shadow-2xl">
            <div class="flex items-center gap-4 mb-10">
                <div class="w-16 h-16 bg-rose-600 rounded-2xl flex items-center justify-center text-3xl font-bold">
                    <span id="initial">U</span>
                </div>
                <div>
                    <h2 id="profile-name" class="text-2xl font-black">User Name</h2>
                    <p class="text-gray-500 text-xs uppercase tracking-widest">Active Member</p>
                </div>
            </div>

            <h3 class="font-bold mb-4 flex items-center gap-2">
                <i class="fas fa-shopping-bag text-rose-500"></i> My Orders
            </h3>
            
            <div class="space-y-4">
                <div class="bg-white/5 p-5 rounded-2xl border border-white/5 flex justify-between items-center">
                    <div>
                        <p class="font-bold text-sm">Netflix Premium 1 Month</p>
                        <p class="text-[10px] text-gray-500">Order ID: #TS7823</p>
                    </div>
                    <span class="px-3 py-1 bg-yellow-500/20 text-yellow-500 text-[10px] rounded-lg font-bold">Pending</span>
                </div>

                <div class="bg-white/5 p-5 rounded-2xl border border-white/5 flex justify-between items-center opacity-50">
                    <div>
                        <p class="font-bold text-sm">Canva Pro Yearly</p>
                        <p class="text-[10px] text-gray-400">Order ID: #TS6512</p>
                    </div>
                    <span class="px-3 py-1 bg-green-500/20 text-green-500 text-[10px] rounded-lg font-bold">Completed</span>
                </div>
            </div>

            <button onclick="localStorage.clear(); location.href='index.html';" class="mt-10 w-full py-4 text-xs font-bold text-gray-500 hover:text-rose-500 transition uppercase tracking-widest">
                <i class="fas fa-sign-out-alt"></i> Logout from Account
            </button>
        </div>
    </div>

    <script>
        const user = localStorage.getItem('user');
        if (!user) {
            window.location.href = 'login.html';
        } else {
            document.getElementById('profile-name').innerText = user;
            document.getElementById('initial').innerText = user.charAt(0).toUpperCase();
        }
    </script>
</body>
</html>
